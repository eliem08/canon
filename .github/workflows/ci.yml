name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install OCR (tesseract fra+ara+eng)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-ara fonts-dejavu-core
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  dependencies:
    # known vulnerabilities in the runtime dependencies (they parse untrusted client files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt > req.txt
      - run: uvx --python 3.12 pip-audit==2.9.0 -r req.txt --progress-spinner off

  browser:
    # the offline review page, driven in Chromium (answer, correct, download, rerun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --with playwright==1.64.1 python -m playwright install --with-deps chromium
      - run: uv run --with playwright==1.64.1 pytest -q tests/test_review_browser.py -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t canon .
      - name: Offline resolve inside the image
        run: |
          mkdir -m 777 out
          docker run --rm --network none -v "$PWD/data/synthetic:/data:ro" -v "$PWD/out:/out" \
            canon resolve --as-of 2026-10-01 | tee resolve.log
          grep -q "26 golden records" resolve.log
          test -s out/canon.sqlite
