[project]
name = "canon"
version = "0.1.0"
description = "Agent-ready data layer: ingest, resolve, score and serve company facts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
]

[project.scripts]
canon = "canon.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic/accented text is intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
